<script data-dc-script type="text/plain">
class Component extends DCLogic {

  state = { d: (function () { try { return JSON.parse(window.localStorage.getItem("ajanda-v3") || "{}"); } catch (e) { return {}; } })(), yuk: true };

  componentDidMount() {
    this.__disDokun();
    (function () {
      const bas = Date.now();
      const t = window.setInterval(function () {
        const dp = document.querySelector("doc-page");
        const ilk = dp && dp.querySelector(":scope > .page");
        if (dp && dp._measure) dp._measure();
        if ((ilk && ilk.offsetHeight > 0) || Date.now() - bas > 30000) window.clearInterval(t);
      }, 400);
    })();
    const git = function () {
      const h = window.location.hash;
      if (!h || h.length < 2) return;
      const el = document.getElementById(decodeURIComponent(h.slice(1)));
      if (el) window.scrollBy(0, el.getBoundingClientRect().top - 12);
    };
    setTimeout(git, 350); setTimeout(git, 1000); setTimeout(git, 2200);
    window.addEventListener("hashchange", function () { setTimeout(git, 80); });
  }

  kaydet(d) { try { window.localStorage.setItem("ajanda-v3", JSON.stringify(d)); } catch (e) {} }

  yaz(k, v) {
    const self = this;
    this.setState(function (st) {
      const d = Object.assign({}, st.d);
      if (v === "" || v === false || v === null || v === undefined) delete d[k]; else d[k] = v;
      self.kaydet(d);
      return { d: d };
    });
  }

  yazCok(cift) {
    const self = this;
    this.setState(function (st) {
      const d = Object.assign({}, st.d);
      Object.keys(cift).forEach(function (k) {
        const v = cift[k];
        if (v === "" || v === false || v === null || v === undefined) delete d[k]; else d[k] = v;
      });
      self.kaydet(d);
      return { d: d };
    });
  }

  al(k) { const d = this.state.d || {}; return d[k] === undefined ? "" : d[k]; }

  yz(k) {
    const self = this;
    return { id: "i-" + k, d: this.al(k), b: function (e) { if (e.target.value !== self.al(k)) self.yaz(k, e.target.value); } };
  }

  cn(k) {
    const self = this;
    return { id: "i-" + k, d: this.al(k), b: function (e) { self.yaz(k, e.target.value); } };
  }

  kt(k, renk) {
    const self = this;
    const acik = !!this.al(k);
    return { bg: acik ? (renk || "#8fae9b") : "transparent", t: function () { self.yaz(k, !acik); } };
  }

  sayi(v) {
    if (!v) return 0;
    const t = String(v).replace(/[^0-9,.-]/g, "").replace(/\./g, "").replace(",", ".");
    const n = parseFloat(t);
    return isNaN(n) ? 0 : n;
  }
  bicim(n) { return n === 0 ? "" : n.toLocaleString("tr-TR", { maximumFractionDigits: 2 }) + " ₺"; }

  foto(id) {
    const self = this;
    const anahtar = "foto-" + id;
    const dizi = this.al(anahtar) || [];
    return {
      fotolar: dizi.map(function (f, i) {
        return {
          gorsel: React.createElement("img", { src: f.src, alt: "", style: { display: "block", width: "100%", height: "auto" } }),
          sol: f.x + "px", ust: f.y + "px", en: f.w + "px",
          bas: function (e) { self.fotoSurukle(anahtar, i, e); },
          dokunBas: function (e) { self.setState({ hv: anahtar + "-" + i }); self.fotoSurukle(anahtar, i, e); },
          boyut: function (e) { self.fotoBoyut(anahtar, i, e); },
          don: function (e) { self.fotoDondur(anahtar, i, e); },
          aci: "rotate(" + (f.a || 0) + "deg)",
          tut: self.state.hv === (anahtar + "-" + i) ? "1" : "0",
          z: self.state.hv === (anahtar + "-" + i) ? 60 : 5 + i,

  stickerYukle(bitince) {
    const self = this;
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.onchange = function () {
      const dosya = inp.files && inp.files[0];
      if (!dosya) return;
      const fr = new FileReader();
      fr.onload = function () {
        const im = new Image();
        im.onload = function () {
          const en = Math.min(340, im.width), boy = Math.round(im.height * en / im.width);
          const c = document.createElement("canvas");
          c.width = en; c.height = boy;
          const x = c.getContext("2d");
          x.drawImage(im, 0, 0, en, boy);
          if (window.confirm("Düz arka planı temizleyeyim mi?")) {
            try {
              const d = x.getImageData(0, 0, en, boy);
              const p = d.data;
              const bg = [p[0], p[1], p[2]];
              const tol = 34;
              const gor = new Uint8Array(en * boy);
              const q = [];
              const yakin = function (k) { return Math.abs(p[k]-bg[0]) < tol && Math.abs(p[k+1]-bg[1]) < tol && Math.abs(p[k+2]-bg[2]) < tol; };
              for (var i = 0; i < en; i++) { [0, boy-1].forEach(function (j) { const idx = j*en+i; if (!gor[idx] && yakin(idx*4)) { gor[idx]=1; q.push(idx); } }); }
              for (var j2 = 0; j2 < boy; j2++) { [0, en-1].forEach(function (i2) { const idx = j2*en+i2; if (!gor[idx] && yakin(idx*4)) { gor[idx]=1; q.push(idx); } }); }
              while (q.length) {
                const t = q.pop(), a = t % en, b = (t / en) | 0;
                [[a-1,b],[a+1,b],[a,b-1],[a,b+1]].forEach(function (uv) {
                  const u = uv[0], v = uv[1];
                  if (u < 0 || v < 0 || u >= en || v >= boy) return;
                  const idx = v*en+u;
                  if (gor[idx] || !yakin(idx*4)) return;
                  gor[idx] = 1; q.push(idx);
                });
              }
              for (var k2 = 0; k2 < en*boy; k2++) if (gor[k2]) p[k2*4+3] = 0;
              x.putImageData(d, 0, 0);
            } catch (err) {}
          }
          const veri = c.toDataURL("image/png");
          const a = (self.al("kendi-st") || []).slice();
          if (a.length >= 40) { window.alert("Kırk kendi sticker'ın var, birini silip tekrar dene."); return; }
          a.push(veri);
          self.yaz("kendi-st", a);
          if (bitince) bitince();
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(dosya);
    };
    inp.click();
  }

  stickerKoy(anahtar, src) {

    im.onload = function () {
      const en = Math.min(240, im.width);
      const a = (self.al(anahtar) || []).slice();
      a.push({ src: src, x: 120 + a.length * 18, y: 260 + a.length * 18, w: en });
      self.yaz(anahtar, a);
    };
    im.onerror = function () {
      const a = (self.al(anahtar) || []).slice();
      a.push({ src: src, x: 140, y: 280, w: 200 });
      self.yaz(anahtar, a);
    };
    im.src = src;

  fotoAl(anahtar) {

          c.width = Math.round(img.width * o); c.height = Math.round(img.height * o);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

  fotoDondur(anahtar, i, e) {
    if (e.cancelable) e.preventDefault();
    e.stopPropagation();
    const self = this;
    const kutu = e.currentTarget.parentElement.getBoundingClientRect();
    const mx = kutu.left + kutu.width / 2, my = kutu.top + kutu.height / 2;
    self.__izle(function (ev) {
      const p = self.__nokta(ev);
      const a = (self.al(anahtar) || []).slice();
      if (!a[i]) return;
      let g = Math.atan2(p.y - my, p.x - mx) * 180 / Math.PI + 135;
      g = Math.round(g / 3) * 3;
      a[i] = Object.assign({}, a[i], { a: g });
      self.setState(function (st) { const d = Object.assign({}, st.d); d[anahtar] = a; return { d: d }; });
    }, function () { self.kaydet(self.state.d); });
  }

  fotoBoyut(anahtar, i, e) {
    if (e.cancelable) e.preventDefault();
    e.stopPropagation();
    const self = this;
    const b = (this.al(anahtar) || [])[i];
    if (!b) return;
    const p0 = self.__nokta(e), bw = b.w || 200;
    self.__izle(function (ev) {
      const p = self.__nokta(ev);
      const a = (self.al(anahtar) || []).slice();
      if (!a[i]) return;
      const en = Math.max(40, Math.min(900, Math.round(bw + (p.x - p0.x))));
      a[i] = Object.assign({}, a[i], { w: en });
      self.setState(function (st) { const d = Object.assign({}, st.d); d[anahtar] = a; return { d: d }; });
    }, function () { self.kaydet(self.state.d); });
  }

  __disDokun() {
    if (this.__disKurulu) return;
    this.__disKurulu = true;
    const self = this;
    document.addEventListener("touchstart", function (e) {
      if (!self.state.hv) return;
      const h = e.target.closest && e.target.closest("[data-sticker]");
      if (!h) self.setState({ hv: null });
    }, true);
  }

  __nokta(e) {
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
    return t ? { x: t.clientX, y: t.clientY } : { x: e.clientX, y: e.clientY };
  }

  __izle(hareket, birak) {
    const sar = function (ev) { if (ev.cancelable) ev.preventDefault(); hareket(ev); };
    const son = function () {
      window.removeEventListener("mousemove", sar);
      window.removeEventListener("mouseup", son);
      window.removeEventListener("touchmove", sar);
      window.removeEventListener("touchend", son);
      window.removeEventListener("touchcancel", son);
      birak();
    };
    window.addEventListener("mousemove", sar);
    window.addEventListener("mouseup", son);
    window.addEventListener("touchmove", sar, { passive: false });
    window.addEventListener("touchend", son);
    window.addEventListener("touchcancel", son);
  }

  fotoSurukle(anahtar, i, e) {
    const self = this;
    if (e.cancelable) e.preventDefault();
    const b = (self.al(anahtar) || [])[i];
    if (!b) return;
    const p0 = self.__nokta(e), bx = b.x, by = b.y;
    self.__izle(function (ev) {
      const p = self.__nokta(ev);
      const a = (self.al(anahtar) || []).slice();
      if (!a[i]) return;
      a[i] = Object.assign({}, a[i], { x: Math.round(bx + p.x - p0.x), y: Math.round(by + p.y - p0.y) });
      self.setState(function (st) { const d = Object.assign({}, st.d); d[anahtar] = a; return { d: d }; });

  tuvalKur(anahtar) {
    const self = this;
    this._tuval = this._tuval || {};
    return function (el) {
      if (!el) return;
      self._tuval[anahtar] = el;
      if (el.__kurulu) return;
      el.__kurulu = true;
      const ctx = el.getContext("2d");
      ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#3a3128";
      const kayit = self.al(anahtar);
      if (kayit) { const im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0); }; im.src = kayit; }
      let ciziyor = false;
      const nokta = function (ev) {
        const r = el.getBoundingClientRect();
        return { x: (ev.clientX - r.left) * el.width / r.width, y: (ev.clientY - r.top) * el.height / r.height };
      };
      el.addEventListener("mousedown", function (ev) { ciziyor = true; const p = nokta(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y); ev.preventDefault(); });
      el.addEventListener("mousemove", function (ev) { if (!ciziyor) return; const p = nokta(ev); ctx.lineTo(p.x, p.y); ctx.stroke(); });
      const bitir = function () { if (!ciziyor) return; ciziyor = false; try { self.yaz(anahtar, el.toDataURL("image/png")); } catch (e) {} };
      el.addEventListener("mouseup", bitir);
      el.addEventListener("mouseleave", bitir);
    };

  ertele(t, onek, r) {
    const self = this;
    const saySt = "ert-" + onek + t + "-" + r;
    const say = parseInt(this.al(saySt) || 0, 10);
    const metinSt = onek + t + "-" + r + "-m";
    const cizik = !!this.al("cz-" + metinSt);
    return {
      cizgi: cizik ? "line-through" : "none",
      renk: cizik ? "#c4c1be" : "#201e1d",
      nokta: [0, 1, 2].map(function (j) { return { bg: j < say ? "#c99a9b" : "transparent" }; }),
      t: function () {
        const metin = self.al(metinSt);
        const si = new Date(new Date(t + "T00:00:00Z").getTime() + 86400000).toISOString().slice(0, 10);
        const hedef = onek + si + "-" + r + "-m";
        if (!metin) {
          if (say > 0 && window.confirm("Bu satırda " + say + " erteleme işareti var. İşaretler silinsin mi?")) self.yaz(saySt, false);
          else if (say === 0) window.alert("Önce işi yaz, sonra ertele.");
          return;
        }
        if (cizik) {
          if (self.al(hedef) === metin && window.confirm("Yarına taşınan kopya geri alınsın mı? Satır burada tekrar açılır.")) {
            const geri = {};
            geri[hedef] = "";
            geri["ert-" + onek + si + "-" + r] = "";
            geri["cz-" + hedef] = false;
            geri["cz-" + metinSt] = false;
            self.yazCok(geri);
            const eh = document.getElementById("i-" + hedef); if (eh) eh.value = "";
            return;
          }
          if (window.confirm("Çizgi kaldırılsın mı?")) self.yaz("cz-" + metinSt, false);
          return;
        }
        if (say >= 3) {
          if (window.confirm("Bu işi üç kez erteledin. Dördüncü kez taşımak yerine kapatalım mı? Satır silinmez, üstü çizilir.")) {
            self.yaz("cz-" + metinSt, true);
          }
          return;
        }
        const cift = {};
        cift[hedef] = metin;
        cift["cz-" + metinSt] = true;
        cift["ert-" + onek + si + "-" + r] = say + 1;
        self.yazCok(cift);
        const e2 = document.getElementById("i-" + hedef); if (e2) e2.value = metin;
        if (say + 1 === 3) window.alert("Üçüncü erteleme. Yarın ya yap ya üstünü çiz.");
      }
    };
  }

        id: "g-" + t,
        gunAd: GUN[dow(d)],
        tarih: d.getUTCDate() + " " + AY[d.getUTCMonth()] + " " + d.getUTCFullYear(),
        ayHref: ayHref(d), hafta: isoHafta(d) + ". hafta", haftaHref: haftaHref(hb),
        yan: GUN.map((g, j) => {
          const dd = gun(hb, j);
          return {
            kisa: GUNK[j], no: String(dd.getUTCDate()), href: gunHref(dd),
            bg: j === dow(d) ? "#efece7" : "transparent",
            fg: j === dow(d) ? "#201e1d" : (icinde(dd) ? "#8d8a87" : "#d4d0cc")
          };
        }),
        saatler: SAAT.map(s => ({
          et: s,
          cizgi: (s === "11" || s === "17") ? "1px solid #bdbab7" : "1px solid #f0edea",
          yz: yz("s-" + t + "-" + s)
        })),
        oncelik: [0, 1, 2].map(r => ({
          kutu: kt("go-" + t + "-" + r, "#8fae9b"),
          ad: yz("goa-" + t + "-" + r), tah: yz("got-" + t + "-" + r), ger: yz("gog-" + t + "-" + r)
        })),
        ilk2: [0, 1, 2].map(r => ({ kutu: kt("gi-" + t + "-" + r, "#8fae9b"), yz: yz("gia-" + t + "-" + r) })),
        yuksek: [0, 1, 2, 3].map(r => ({ kutu: kt("gy-" + t + "-" + r, "#7d9ea3"), yz: yz("gy-" + t + "-" + r + "-m"), ertele: this.ertele(t, "gy-", r) })),
        dusuk: [0, 1, 2, 3].map(r => ({ kutu: kt("gd-" + t + "-" + r, "#a9a6a3"), yz: yz("gd-" + t + "-" + r + "-m"), ertele: this.ertele(t, "gd-", r) })),
        su: [0,1,2,3,4,5,6,7].map(r => kt("gsu-" + t + "-" + r, "#9ab7b0")),
        enerji: [0,1,2,3,4].map(r => kt("ge-" + t + "-" + r, "#a89ac4")),
        aliskanlik: [0, 1, 2, 3].map(r => {
          const ad = this.al("hn-" + r);
          return { kutu: kt("gal-" + t + "-" + r, "#c99a9b"), ad: ad || "—", renk: ad ? "#4a4744" : "#c9c5c1" };
        }),
        not: yz("gn-" + t), iyiAn: yz("gia2-" + t),
        araclar: [
          { ad: "BOŞ SAYFA", href: ANA + "#serbest", renk: "#d9a273", t: () => this.gunSec(t) },
          { ad: "ZOR GÜN", href: ANA + "#zorgun", renk: "#d9a273", t: () => this.gunSec(t) },
          { ad: "BEYİN FIRTINASI", href: ANA + "#beyin", renk: "#d9a273", t: () => this.gunSec(t) },
          { ad: "HER ŞEY", href: ANA + "#bosalt", renk: "#d9a273", t: () => this.gunSec(t) },
          { ad: "HEP HATIRIMDA KALSIN", href: ANA + "#hatira-" + hatiraSayfa(d), renk: "#8fb4d4", t: () => {} }
        ],
        geri: oncekiGun(d) ? "‹ " + oncekiGun(d).getUTCDate() + " " + AYK[oncekiGun(d).getUTCMonth()] : "‹ Haftalar",
        geriHref: oncekiGun(d) ? gunHref(oncekiGun(d)) : haftaHref(haftaBas[0]),
        ileri: sonrakiGun(d) ? sonrakiGun(d).getUTCDate() + " " + AYK[sonrakiGun(d).getUTCMonth()] + " ›" : "Notlar ›",
        ileriHref: sonrakiGun(d) ? gunHref(sonrakiGun(d)) : ANA + "#beyin-1"
      };
    });

    this.fotoKur([gunler]);
    return {
      sekGun: serit(5), gunler, tocHref: ANA + "#toc",
      tocHref2: ""
    };
  }
}
</script>
